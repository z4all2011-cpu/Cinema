<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سينما بارتي | Watch Party & IPTV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { background-color: #0b0b0f; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #13131a; }
    ::-webkit-scrollbar-thumb { background: #4c1d95; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-10">

  <!-- الشريط العلوي -->
  <header class="bg-[#13131a] border-b border-gray-800 px-4 py-3 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-purple-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-purple-600/30">▶</div>
        <div>
          <h1 class="font-bold text-base leading-tight">سينما بارتي</h1>
          <p class="text-[11px] text-gray-400">مزامنة P2P + مكتبة IPTV</p>
        </div>
      </div>

      <!-- حالة الاتصال -->
      <div id="connBadge" class="flex items-center gap-2 bg-gray-900 border border-gray-700 px-3 py-1.5 rounded-full text-xs">
        <span id="connDot" class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse"></span>
        <span id="connText">بانتظار الاتصال...</span>
      </div>
    </div>

    <!-- شريط الكود والربط -->
    <div class="max-w-4xl mx-auto mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2">
      <div class="flex items-center justify-between bg-gray-900/90 border border-gray-800 rounded-xl px-3 py-2">
        <span class="text-xs text-gray-400">كودك:</span>
        <span id="myCode" class="font-mono font-bold text-purple-400 tracking-widest text-sm">...</span>
        <button onclick="copyMyCode()" class="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1 rounded-lg text-gray-200">نسخ</button>
      </div>

      <div id="joinBox" class="flex items-center gap-1.5">
        <input id="friendCodeInput" type="text" maxlength="6" placeholder="أدخل كود صديقك" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-center font-mono uppercase focus:outline-none focus:border-purple-500" />
        <button onclick="connectToFriend()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap">انضمام</button>
      </div>

      <div id="disconnectBox" class="hidden flex items-center justify-end">
        <button onclick="disconnectPeer()" class="w-full sm:w-auto bg-red-900/50 hover:bg-red-800/70 border border-red-700/50 text-red-200 px-4 py-2 rounded-xl text-xs font-bold">قطع الاتصال</button>
      </div>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="max-w-4xl w-full mx-auto px-3 pt-3 flex-1 flex flex-col gap-3">

    <!-- تنبيهات -->
    <div id="alertBox" class="hidden bg-red-950/90 border border-red-700 text-red-200 px-4 py-2.5 rounded-xl text-xs text-center"></div>

    <!-- مشغل الفيديو -->
    <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-gray-800 shadow-2xl">
      <video id="videoPlayer" class="w-full h-full object-contain bg-black" controls playsinline crossorigin="anonymous"></video>
      <div id="ytPlayerWrapper" class="hidden w-full h-full">
        <div id="ytPlayer"></div>
      </div>

      <!-- طبقة تفعيل الصوت للمتصفح -->
      <div id="unmuteOverlay" onclick="unlockAudio()" class="hidden absolute inset-0 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-4 text-center cursor-pointer z-20">
        <div class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-6 py-3.5 rounded-2xl shadow-xl flex items-center gap-2 text-sm">
          <span>▶</span>
          <span>اضغط هنا لتفعيل الصوت ومزامنة البث</span>
        </div>
        <p class="text-[11px] text-gray-400 mt-2">المتصفح يتطلب نقرة واحدة للسماح بالتشغيل مع الصوت</p>
      </div>

      <!-- شارة وضع البث المباشر P2P -->
      <div id="relayBadge" class="hidden absolute top-3 left-3 bg-emerald-600/90 text-white text-[10px] font-bold px-2.5 py-1 rounded-full z-10 shadow">
        بث مباشر P2P (حماية الاشتراك مفعلة)
      </div>
    </div>

    <!-- أزرار التحكم السريعة -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
      <button onclick="forceSync()" class="bg-[#16161f] hover:bg-gray-800 border border-gray-800 py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5">
        <span>🔄</span><span>مزامنة الآن</span>
      </button>
      <label class="bg-[#16161f] hover:bg-gray-800 border border-gray-800 py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5 cursor-pointer">
        <span>💬</span><span>ترجمة SRT/VTT</span>
        <input type="file" accept=".srt,.vtt" class="hidden" onchange="loadSubtitle(event)" />
      </label>
      <label class="bg-[#16161f] hover:bg-gray-800 border border-gray-800 py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5 cursor-pointer">
        <span>📁</span><span>ملف MP4 محلي</span>
        <input type="file" accept="video/mp4,video/webm" class="hidden" onchange="loadLocalVideo(event)" />
      </label>
      <button id="relayToggleBtn" onclick="toggleRelayMode()" class="bg-emerald-950/60 border border-emerald-700/60 text-emerald-300 py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5">
        <span>🛡️</span><span id="relayToggleText">حماية الاشتراك: مفعّل</span>
      </button>
    </div>

    <!-- التبويبات: رابط مباشر/يوتيوب أو مكتبة Xtream IPTV -->
    <div class="bg-[#13131a] border border-gray-800 rounded-2xl p-3">
      <div class="flex gap-2 border-b border-gray-800 pb-2.5 mb-3">
        <button id="tabBtnDirect" onclick="switchTab('direct')" class="flex-1 py-2 rounded-xl text-xs font-bold bg-purple-600 text-white">رابط مباشر / يوتيوب</button>
        <button id="tabBtnXtream" onclick="switchTab('xtream')" class="flex-1 py-2 rounded-xl text-xs font-bold bg-gray-900 text-gray-400 hover:text-white">مكتبة Xtream IPTV</button>
      </div>

      <!-- قسم الرابط المباشر ويوتيوب -->
      <div id="tabDirect" class="space-y-2.5">
        <div class="flex flex-col sm:flex-row gap-2">
          <input id="videoUrlInput" type="text" dir="ltr" placeholder="https://... (MP4, M3U8, أو رابط YouTube)" class="flex-1 bg-gray-950 border border-gray-800 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-purple-500" />
          <button onclick="playInputUrl()" class="bg-purple-600 hover:bg-purple-500 px-5 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap">تشغيل ومشاركة</button>
        </div>
      </div>

      <!-- قسم Xtream Codes IPTV -->
      <div id="tabXtream" class="hidden space-y-3">
        <!-- بيانات الدخول -->
        <div id="xtreamLoginForm" class="space-y-2">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <input id="xtHost" type="text" dir="ltr" placeholder="http://server.com:8080" class="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-purple-500" />
            <input id="xtUser" type="text" dir="ltr" placeholder="اسم المستخدم (Username)" class="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-purple-500" />
            <input id="xtPass" type="password" dir="ltr" placeholder="كلمة السر (Password)" class="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-purple-500" />
          </div>
          <button onclick="loginXtream()" id="xtLoginBtn" class="w-full bg-purple-600 hover:bg-purple-500 py-2.5 rounded-xl text-xs font-bold">دخول وجلب المكتبة</button>
        </div>

        <!-- واجهة تصفح المكتبة بعد الدخول -->
        <div id="xtreamBrowser" class="hidden space-y-2.5">
          <div class="flex flex-wrap items-center justify-between gap-2 bg-gray-950 p-2 rounded-xl border border-gray-800">
            <div class="flex gap-1.5">
              <button onclick="loadXtreamSection('series')" id="xtSecSeries" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-purple-600 text-white">المسلسلات</button>
              <button onclick="loadXtreamSection('vod')" id="xtSecVod" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-900 text-gray-300">الأفلام</button>
              <button onclick="loadXtreamSection('live')" id="xtSecLive" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-900 text-gray-300">قنوات مباشرة</button>
            </div>
            <button onclick="logoutXtream()" class="text-[11px] text-red-400 hover:underline px-2">تغيير الحساب</button>
          </div>

          <!-- الفئة والبحث -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <select id="xtCategorySelect" onchange="filterXtreamItems()" class="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none">
              <option value="all">كل الأقسام</option>
            </select>
            <input id="xtSearchInput" oninput="filterXtreamItems()" type="text" placeholder="ابحث باسم المسلسل أو الفيلم أو القناة..." class="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-purple-500" />
          </div>

          <!-- عرض الحلقات لمسلسل محدد -->
          <div id="seriesEpisodesBox" class="hidden bg-gray-950 border border-purple-800/50 rounded-xl p-3 space-y-2">
            <div class="flex items-center justify-between">
              <h3 id="selectedSeriesTitle" class="text-xs font-bold text-purple-300"></h3>
              <button onclick="closeSeriesBox()" class="text-xs bg-gray-800 px-2.5 py-1 rounded-lg">رجوع للقائمة</button>
            </div>
            <div id="episodesGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-2 max-h-60 overflow-y-auto pt-1"></div>
          </div>

          <!-- شبكة البطاقات -->
          <div id="xtLoading" class="hidden text-center py-6 text-xs text-purple-400 animate-pulse">جاري جلب البيانات من السيرفر...</div>
          <div id="xtItemsGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 max-h-80 overflow-y-auto pr-1"></div>
        </div>
      </div>
    </div>

    <!-- المحادثة الفورية -->
    <div class="bg-[#13131a] border border-gray-800 rounded-2xl p-3 flex flex-col">
      <div class="text-xs font-bold text-gray-300 mb-2 flex items-center justify-between">
        <span>الدردشة المباشرة</span>
        <span class="text-[10px] text-gray-500">مشفر P2P</span>
      </div>
      <div id="chatMessages" class="h-36 overflow-y-auto space-y-1.5 bg-gray-950/70 rounded-xl p-2.5 mb-2 text-xs">
        <div class="text-gray-500 text-center text-[11px]">شارك كودك مع صديقك للبدء...</div>
      </div>
      <div class="flex gap-2">
        <input id="chatInput" type="text" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendChat()" class="flex-1 bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-purple-500" />
        <button onclick="sendChat()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-xl text-xs font-bold">إرسال</button>
      </div>
    </div>

  </main>

  <script>
    const WORKER_URL = "https://still-scene-7881.z4all2011.workers.dev/";
    const video = document.getElementById('videoPlayer');
    let peer = null;
    let conn = null;
    let mediaCall = null;
    let hls = null;
    let ytPlayer = null;
    let isYouTubeMode = false;
    let isRemoteAction = false;
    let relayMode = true; // افتراضياً مفعل لحماية اشتراك Xtream

    // توليد كود من 6 خانات
    const myShortId = Math.random().toString(36).substring(2, 8).toUpperCase();
    document.getElementById('myCode').textContent = myShortId;

    function showAlert(msg) {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 6000);
    }

    function copyMyCode() {
      navigator.clipboard.writeText(myShortId);
      showAlert("تم نسخ كودك: " + myShortId);
    }

    // تهيئة PeerJS
    function initPeer() {
      peer = new Peer('cinema-' + myShortId);

      peer.on('open', () => {
        updateConnStatus('yellow', 'جاهز للربط');
      });

      peer.on('connection', (incomingConn) => {
        conn = incomingConn;
        setupDataConn();
      });

      // استقبال البث المباشر من صديقك (P2P Stream Relay)
      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (remoteStream) => {
          switchToHtml5Player();
          if (hls) { hls.destroy(); hls = null; }
          video.srcObject = remoteStream;
          document.getElementById('relayBadge').classList.remove('hidden');
          document.getElementById('unmuteOverlay').classList.remove('hidden');
          video.play().catch(() => {});
        });
      });

      peer.on('error', (err) => {
        showAlert("خطأ في الاتصال: " + err.type);
      });
    }

    function connectToFriend() {
      const code = document.getElementById('friendCodeInput').value.trim().toUpperCase();
      if (code.length < 4) return showAlert("أدخل كود صحيح مكون من 6 أحرف");
      updateConnStatus('yellow', 'جاري الاتصال بصديقك...');
      conn = peer.connect('cinema-' + code);
      setupDataConn();
    }

    function setupDataConn() {
      conn.on('open', () => {
        updateConnStatus('green', 'متصل بصديقك (P2P)');
        document.getElementById('joinBox').classList.add('hidden');
        document.getElementById('disconnectBox').classList.remove('hidden');
        appendChat('النظام', 'تم الاتصال بصديقك بنجاح!', true);
      });

      conn.on('data', (data) => {
        handleIncomingData(data);
      });

      conn.on('close', () => {
        updateConnStatus('red', 'انقطع الاتصال');
        document.getElementById('joinBox').classList.remove('hidden');
        document.getElementById('disconnectBox').classList.add('hidden');
      });
    }

    function disconnectPeer() {
      if (conn) conn.close();
      if (mediaCall) mediaCall.close();
    }

    function updateConnStatus(color, text) {
      const dot = document.getElementById('connDot');
      dot.className = `w-2.5 h-2.5 rounded-full ${color === 'green' ? 'bg-emerald-500' : color === 'red' ? 'bg-red-500' : 'bg-yellow-500 animate-pulse'}`;
      document.getElementById('connText').textContent = text;
    }

    function sendData(payload) {
      if (conn && conn.open) conn.send(payload);
    }

    function toggleRelayMode() {
      relayMode = !relayMode;
      document.getElementById('relayToggleText').textContent = relayMode ? 'حماية الاشتراك: مفعّل' : 'حماية الاشتراك: إرسال رابط';
    }

    // استخراج ID يوتيوب
    function getYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function switchToHtml5Player() {
      isYouTubeMode = false;
      document.getElementById('ytPlayerWrapper').classList.add('hidden');
      video.classList.remove('hidden');
      if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
    }

    function switchToYouTubePlayer(ytId) {
      isYouTubeMode = true;
      video.pause();
      video.classList.add('hidden');
      document.getElementById('relayBadge').classList.add('hidden');
      document.getElementById('ytPlayerWrapper').classList.remove('hidden');

      if (!window.YT) {
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);
        window.onYouTubeIframeAPIReady = () => createYTPlayer(ytId);
      } else {
        createYTPlayer(ytId);
      }
    }

    function createYTPlayer(ytId) {
      if (ytPlayer) {
        ytPlayer.loadVideoById(ytId);
        return;
      }
      ytPlayer = new YT.Player('ytPlayer', {
        width: '100%',
        height: '100%',
        videoId: ytId,
        playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
        events: {
          onStateChange: (e) => {
            if (isRemoteAction) return;
            if (e.data === YT.PlayerState.PLAYING) {
              sendData({ type: 'sync', action: 'play', time: ytPlayer.getCurrentTime() });
            } else if (e.data === YT.PlayerState.PAUSED) {
              sendData({ type: 'sync', action: 'pause', time: ytPlayer.getCurrentTime() });
            }
          }
        }
      });
    }

    // تشغيل رابط من خانة الرابط المباشر
    function playInputUrl() {
      const url = document.getElementById('videoUrlInput').value.trim();
      if (!url) return showAlert("الرجاء إدخال رابط الفيديو");

      const ytId = getYouTubeId(url);
      if (ytId) {
        switchToYouTubePlayer(ytId);
        sendData({ type: 'load_yt', ytId });
        return;
      }

      loadStreamUrl(url, false);
      sendData({ type: 'load_url', url });
    }

    // تشغيل بث مباشر أو ملف MP4/M3U8
    function loadStreamUrl(url, useRelayForXtream = false) {
      switchToHtml5Player();
      video.srcObject = null;
      document.getElementById('relayBadge').classList.add('hidden');

      if (hls) { hls.destroy(); hls = null; }

      if (url.includes('.m3u8') && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => document.getElementById('unmuteOverlay').classList.remove('hidden'));
          if (useRelayForXtream && relayMode) startP2PStreamRelay();
        });
        hls.on(Hls.Events.ERROR, (e, data) => {
          if (data.fatal) showAlert("تعذر تشغيل البث، تأكد من الرابط أو البروكسي.");
        });
      } else {
        video.src = url;
        video.play().then(() => {
          if (useRelayForXtream && relayMode) startP2PStreamRelay();
        }).catch(() => {
          document.getElementById('unmuteOverlay').classList.remove('hidden');
        });
      }
    }

    // تمرير البث المباشر من جهازي لصديقي لحماية اشتراك Xtream
    function startP2PStreamRelay() {
      if (!conn || !conn.open) return;
      try {
        const stream = video.captureStream ? video.captureStream() : (video.mozCaptureStream ? video.mozCaptureStream() : null);
        if (stream) {
          if (mediaCall) mediaCall.close();
          mediaCall = peer.call(conn.peer, stream);
          document.getElementById('relayBadge').classList.remove('hidden');
        } else {
          showAlert("متصفحك لا يدعم تمرير البث المباشر، سيتم إرسال الرابط.");
        }
      } catch (err) {
        console.error(err);
      }
    }

    function unlockAudio() {
      document.getElementById('unmuteOverlay').classList.add('hidden');
      if (isYouTubeMode && ytPlayer) {
        ytPlayer.unMute();
        ytPlayer.playVideo();
      } else {
        video.muted = false;
        video.play();
      }
    }

    // أحداث المزامنة لمشغل HTML5
    video.addEventListener('play', () => {
      if (!isRemoteAction) sendData({ type: 'sync', action: 'play', time: video.currentTime });
    });
    video.addEventListener('pause', () => {
      if (!isRemoteAction) sendData({ type: 'sync', action: 'pause', time: video.currentTime });
    });
    video.addEventListener('seeked', () => {
      if (!isRemoteAction) sendData({ type: 'sync', action: 'seek', time: video.currentTime });
    });

    function forceSync() {
      const t = isYouTubeMode && ytPlayer ? ytPlayer.getCurrentTime() : video.currentTime;
      const paused = isYouTubeMode && ytPlayer ? (ytPlayer.getPlayerState() !== 1) : video.paused;
      sendData({ type: 'sync', action: paused ? 'pause' : 'play', time: t });
      showAlert("تم إرسال إشارة المزامنة لصديقك");
    }

    function handleIncomingData(data) {
      if (data.type === 'chat') {
        appendChat('صديقك', data.msg, false);
      } else if (data.type === 'load_url') {
        document.getElementById('videoUrlInput').value = data.url;
        loadStreamUrl(data.url, false);
        document.getElementById('unmuteOverlay').classList.remove('hidden');
      } else if (data.type === 'load_yt') {
        switchToYouTubePlayer(data.ytId);
      } else if (data.type === 'sync') {
        isRemoteAction = true;
        if (isYouTubeMode && ytPlayer) {
          if (Math.abs(ytPlayer.getCurrentTime() - data.time) > 1.5) ytPlayer.seekTo(data.time, true);
          if (data.action === 'play') ytPlayer.playVideo();
          if (data.action === 'pause') ytPlayer.pauseVideo();
        } else if (!video.srcObject) {
          if (Math.abs(video.currentTime - data.time) > 1.5) video.currentTime = data.time;
          if (data.action === 'play') video.play().catch(() => document.getElementById('unmuteOverlay').classList.remove('hidden'));
          if (data.action === 'pause') video.pause();
        }
        setTimeout(() => { isRemoteAction = false; }, 500);
      }
    }

    // ملف محلي والترجمة
    function loadLocalVideo(e) {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      loadStreamUrl(url, relayMode);
    }

    function loadSubtitle(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        let content = ev.target.result;
        if (file.name.endsWith('.srt')) {
          content = "WEBVTT\n\n" + content.replace(/,/g, '.');
        }
        const blob = new Blob([content], { type: 'text/vtt' });
        const track = document.createElement('track');
        track.kind = 'subtitles';
        track.label = 'العربية';
        track.srclang = 'ar';
        track.src = URL.createObjectURL(blob);
        track.default = true;
        video.innerHTML = '';
        video.appendChild(track);
        showAlert("تمت إضافة ملف الترجمة بنجاح");
      };
      reader.readAsText(file);
    }

    // الشات
    function sendChat() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      appendChat('أنت', msg, true);
      sendData({ type: 'chat', msg });
      input.value = '';
    }

    function appendChat(sender, msg, isMe) {
      const box = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = isMe ? 'text-right' : 'text-left';
      div.innerHTML = `<span class="inline-block px-2.5 py-1 rounded-xl ${isMe ? 'bg-purple-900/60 text-purple-100' : 'bg-gray-800 text-gray-200'}"><b>${sender}:</b> ${msg}</span>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // التبديل بين التبويبات
    function switchTab(tab) {
      document.getElementById('tabDirect').classList.toggle('hidden', tab !== 'direct');
      document.getElementById('tabXtream').classList.toggle('hidden', tab !== 'xtream');
      document.getElementById('tabBtnDirect').className = tab === 'direct' ? 'flex-1 py-2 rounded-xl text-xs font-bold bg-purple-600 text-white' : 'flex-1 py-2 rounded-xl text-xs font-bold bg-gray-900 text-gray-400';
      document.getElementById('tabBtnXtream').className = tab === 'xtream' ? 'flex-1 py-2 rounded-xl text-xs font-bold bg-purple-600 text-white' : 'flex-1 py-2 rounded-xl text-xs font-bold bg-gray-900 text-gray-400';
    }

    // ================= منطق Xtream Codes IPTV عبر البروكسي =================
    let xtConfig = JSON.parse(localStorage.getItem('xtConfig') || 'null');
    let currentXtType = 'series';
    let allXtItems = [];

    if (xtConfig) {
      document.getElementById('xtHost').value = xtConfig.host;
      document.getElementById('xtUser').value = xtConfig.user;
      document.getElementById('xtPass').value = xtConfig.pass;
    }

    function proxiedUrl(rawUrl) {
      return WORKER_URL + "?url=" + encodeURIComponent(rawUrl);
    }

    async function loginXtream() {
      let host = document.getElementById('xtHost').value.trim().replace(/\/+$/, '');
      const user = document.getElementById('xtUser').value.trim();
      const pass = document.getElementById('xtPass').value.trim();
      if (!host || !user || !pass) return showAlert("أدخل بيانات اشتراك Xtream كاملة");
      if (!host.startsWith('http')) host = 'http://' + host;

      const btn = document.getElementById('xtLoginBtn');
      btn.textContent = "جاري التحقق من الاشتراك...";
      btn.disabled = true;

      try {
        const apiUrl = `${host}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;
        const res = await fetch(proxiedUrl(apiUrl));
        const data = await res.json();
        if (data.user_info && data.user_info.auth === 1) {
          xtConfig = { host, user, pass };
          localStorage.setItem('xtConfig', JSON.stringify(xtConfig));
          document.getElementById('xtreamLoginForm').classList.add('hidden');
          document.getElementById('xtreamBrowser').classList.remove('hidden');
          loadXtreamSection('series');
        } else {
          showAlert("بيانات الاشتراك غير صحيحة أو منتهية الصلاحية");
        }
      } catch (e) {
        showAlert("فشل الاتصال بسيرفر IPTV عبر البروكسي");
      } finally {
        btn.textContent = "دخول وجلب المكتبة";
        btn.disabled = false;
      }
    }

    function logoutXtream() {
      document.getElementById('xtreamLoginForm').classList.remove('hidden');
      document.getElementById('xtreamBrowser').classList.add('hidden');
    }

    async function loadXtreamSection(type) {
      currentXtType = type;
      closeSeriesBox();
      ['series', 'vod', 'live'].forEach(t => {
        const b = document.getElementById('xtSec' + t.charAt(0).toUpperCase() + t.slice(1));
        b.className = t === type ? 'px-3 py-1.5 rounded-lg text-xs font-bold bg-purple-600 text-white' : 'px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-900 text-gray-300';
      });

      const grid = document.getElementById('xtItemsGrid');
      const loader = document.getElementById('xtLoading');
      grid.innerHTML = '';
      loader.classList.remove('hidden');

      const catAction = type === 'series' ? 'get_series_categories' : type === 'vod' ? 'get_vod_categories' : 'get_live_categories';
      const itemsAction = type === 'series' ? 'get_series' : type === 'vod' ? 'get_vod_streams' : 'get_live_streams';

      try {
        const base = `${xtConfig.host}/player_api.php?username=${encodeURIComponent(xtConfig.user)}&password=${encodeURIComponent(xtConfig.pass)}`;
        const [catRes, itemsRes] = await Promise.all([
          fetch(proxiedUrl(`${base}&action=${catAction}`)).then(r => r.json()),
          fetch(proxiedUrl(`${base}&action=${itemsAction}`)).then(r => r.json())
        ]);

        const sel = document.getElementById('xtCategorySelect');
        sel.innerHTML = '<option value="all">كل الأقسام</option>';
        if (Array.isArray(catRes)) {
          catRes.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.category_id;
            opt.textContent = c.category_name;
            sel.appendChild(opt);
          });
        }

        allXtItems = Array.isArray(itemsRes) ? itemsRes : [];
        filterXtreamItems();
      } catch (e) {
        showAlert("حدث خطأ أثناء جلب القائمة");
      } finally {
        loader.classList.add('hidden');
      }
    }

    function filterXtreamItems() {
      const catId = document.getElementById('xtCategorySelect').value;
      const q = document.getElementById('xtSearchInput').value.trim().toLowerCase();
      const grid = document.getElementById('xtItemsGrid');
      grid.innerHTML = '';

      const filtered = allXtItems.filter(item => {
        const matchCat = catId === 'all' || String(item.category_id) === String(catId);
        const name = (item.name || '').toLowerCase();
        return matchCat && name.includes(q);
      }).slice(0, 80); // عرض أول 80 نتيجة لسرعة التصفح على الموبايل

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-gray-950 border border-gray-800 hover:border-purple-500 rounded-xl overflow-hidden cursor-pointer flex flex-col';
        const img = item.cover || item.stream_icon || '';
        card.innerHTML = `
          <div class="h-28 bg-gray-900 flex items-center justify-center overflow-hidden">
            ${img ? `<img src="${img}" loading="lazy" class="w-full h-full object-cover" onerror="this.style.display='none'">` : '<span class="text-2xl">🎬</span>'}
          </div>
          <div class="p-2 text-[11px] font-medium line-clamp-2 text-center">${item.name}</div>
        `;
        card.onclick = () => onXtreamItemClick(item);
        grid.appendChild(card);
      });
    }

    async function onXtreamItemClick(item) {
      if (currentXtType === 'series') {
        // جلب حلقات المسلسل
        document.getElementById('xtLoading').classList.remove('hidden');
        try {
          const url = `${xtConfig.host}/player_api.php?username=${encodeURIComponent(xtConfig.user)}&password=${encodeURIComponent(xtConfig.pass)}&action=get_series_info&series_id=${item.series_id}`;
          const info = await fetch(proxiedUrl(url)).then(r => r.json());
          document.getElementById('selectedSeriesTitle').textContent = item.name;
          const epGrid = document.getElementById('episodesGrid');
          epGrid.innerHTML = '';

          if (info.episodes) {
            Object.keys(info.episodes).forEach(seasonNum => {
              info.episodes[seasonNum].forEach(ep => {
                const btn = document.createElement('button');
                btn.className = 'bg-gray-900 hover:bg-purple-600 border border-gray-700 rounded-lg p-2 text-[11px] text-center truncate';
                btn.textContent = `م${seasonNum} - ح${ep.episode_num}`;
                btn.onclick = () => {
                  const ext = ep.container_extension || 'mp4';
                  const rawStream = `${xtConfig.host}/series/${xtConfig.user}/${xtConfig.pass}/${ep.id}.${ext}`;
                  playXtreamStream(rawStream);
                };
                epGrid.appendChild(btn);
              });
            });
          }
          document.getElementById('seriesEpisodesBox').classList.remove('hidden');
        } catch (e) {
          showAlert("تعذر جلب حلقات المسلسل");
        } finally {
          document.getElementById('xtLoading').classList.add('hidden');
        }
      } else if (currentXtType === 'vod') {
        const ext = item.container_extension || 'mp4';
        const rawStream = `${xtConfig.host}/movie/${xtConfig.user}/${xtConfig.pass}/${item.stream_id}.${ext}`;
        playXtreamStream(rawStream);
      } else {
        const rawStream = `${xtConfig.host}/live/${xtConfig.user}/${xtConfig.pass}/${item.stream_id}.m3u8`;
        playXtreamStream(rawStream);
      }
    }

    function closeSeriesBox() {
      document.getElementById('seriesEpisodesBox').classList.add('hidden');
    }

    function playXtreamStream(rawStreamUrl) {
      const finalUrl = proxiedUrl(rawStreamUrl);
      loadStreamUrl(finalUrl, true);
      if (!relayMode) {
        sendData({ type: 'load_url', url: finalUrl });
      }
    }

    initPeer();
  </script>
</body>
</html>
